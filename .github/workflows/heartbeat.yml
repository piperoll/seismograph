# Heartbeat: catches the failure the canary itself cannot report - a run that
# never FIRES. The canary's in-job failure alert only runs when the job runs;
# a scheduled run that GitHub silently skips, or a commit that never lands,
# leaves no trace. This independent workflow checks that a fresh daily reading
# actually exists on main and pushes an ntfy alert if the series has gone stale.
#
# The daily cron commits reading-<today>-daily.json every day (Sundays too:
# the 08:30 daily fires alongside the 08:45 weekly). So at 20:00 UTC - ~11.5h
# after the daily should have committed - the newest daily reading must be
# today. Older than that means a run was missed.
name: heartbeat
on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC: long after the 08:30 daily should be in
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Alert if the daily series is stale
        env:
          NTFY_TOPIC: ${{ secrets.SEISMO_NTFY_TOPIC }}
        run: |
          NEWEST=$(ls -1 readings/*/reading-*-daily.json 2>/dev/null \
            | sed -E 's#.*/reading-([0-9]{4}-[0-9]{2}-[0-9]{2})-daily\.json#\1#' \
            | sort | tail -1)
          if [ -z "$NEWEST" ]; then
            MSG="no daily readings found on main at all"
          else
            AGE=$(( ( $(date -u +%s) - $(date -u -d "$NEWEST" +%s) ) / 86400 ))
            if [ "$AGE" -le 0 ]; then
              echo "fresh: newest daily reading is $NEWEST (today)"; exit 0
            fi
            MSG="newest daily reading is $NEWEST (${AGE}d old) - a canary run was missed. A day not measured is a baseline gone forever."
          fi
          echo "STALE: $MSG"
          if [ -z "$NTFY_TOPIC" ]; then
            echo "SEISMO_NTFY_TOPIC unset - cannot push; failing loudly instead"
            exit 1
          fi
          curl -sS --max-time 20 \
            -H "Title: seismograph heartbeat: STALE" \
            -H "Priority: urgent" \
            -H "Tags: skull" \
            -d "$MSG Check the canary workflow." \
            "https://ntfy.sh/${NTFY_TOPIC}" || true
          # exit non-zero so the heartbeat run itself is red in the Actions list
          exit 1

      # Per-model coverage: the staleness check above proves *a* reading landed,
      # but a single provider can go dark (quota exhausted, billing lapsed,
      # account suspended) while every other model reads fine - and nobody is
      # pinged. That is exactly what happened Sep 6-10 2026: five models on two
      # credit-tier providers erroring 100% for days, invisible until a manual
      # look. This flags a model fully errored across the two most recent daily
      # readings (persistent, so a one-day provider blip does not cry wolf).
      # runs even if the staleness step failed, so the two alerts are independent.
      - name: Alert if any model has gone dark
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.SEISMO_NTFY_TOPIC }}
        run: |
          python3 - <<'PY'
          import glob, json, os, sys, urllib.request
          # fixed-tier daily readings only: the -daily-dynamic.json suffix does
          # not match, and weekly is a different battery
          files = sorted(glob.glob("readings/*/reading-*-daily.json"))
          if len(files) < 2:
              print("need 2 daily readings to confirm a persistent outage; skipping")
              sys.exit(0)
          latest = json.load(open(files[-1]))
          prev = json.load(open(files[-2]))

          def dark(reading):
              out = {}
              for mid, m in reading["models"].items():
                  calls = m.get("calls", 0)
                  if calls and m.get("call_errors", 0) == calls:
                      cls = max((m.get("errors_by_class") or {"unknown": 1}).items(),
                                key=lambda kv: kv[1])[0]
                      out[mid] = cls
              return out

          # persistent = fully errored in BOTH readings; a transient one-day
          # failure (network, brief provider outage) is not alerted
          latest_dark, prev_dark = dark(latest), dark(prev)
          persistent = {mid: cls for mid, cls in latest_dark.items() if mid in prev_dark}
          if not persistent:
              print("no persistently-dark models")
              sys.exit(0)

          lines = "; ".join(f"{mid} ({cls})" for mid, cls in sorted(persistent.items()))
          msg = (f"{len(persistent)} model(s) fully errored two days running "
                 f"(through {latest['reading_date']}): {lines}. "
                 "Likely quota/billing or a provider outage - check credit.")
          print("DARK:", msg)
          topic = os.environ.get("NTFY_TOPIC", "").strip()
          if not topic:
              print("SEISMO_NTFY_TOPIC unset - failing loudly instead")
              sys.exit(1)
          req = urllib.request.Request(
              f"https://ntfy.sh/{topic}", data=msg.encode("utf-8"),
              headers={"Title": "seismograph: model(s) dark",
                       "Priority": "high", "Tags": "warning"})
          try:
              urllib.request.urlopen(req, timeout=20)
          except Exception as e:
              print("ntfy push failed (non-fatal):", e)
          # red so a standing outage stays visible in the Actions list
          sys.exit(1)
          PY
