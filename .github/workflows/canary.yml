# Daily canary: run the battery, digest to a public-safe reading, witness in
# Rekor, commit the reading. Raw sessions (outputs can echo probes) go to the
# private seismograph-raw repo when RAW_PUSH_TOKEN exists; until then they are
# kept as 90-day workflow artifacts - a stopgap, not the archive.
#
# The charter decouples measurement from publication: this runs while the repo
# is private; nothing here publishes a reading anywhere public except the
# Rekor hash anchor, which is the point.
name: canary
on:
  schedule:
    - cron: "30 8 * * *"    # daily battery, 08:30 UTC (00:30 PT: Google quota days reset at midnight Pacific; running just after gives the cron first claim on the fresh quota, so a manual daytime run can never starve it)
    - cron: "45 8 * * 0"    # weekly battery, Sundays 08:45 UTC
  workflow_dispatch:
    inputs:
      cadence:
        description: "battery cadence"
        type: choice
        options: [daily, weekly]
        default: daily
      only_models:
        description: "comma-separated roster ids to rerun and MERGE into today's reading (only those models are billed), or 'failed' = every model missing, fully errored or billing-blocked in today's reading"
        type: string
        default: ""
      from_run_id:
        description: "re-digest the raw-session artifact of this run id instead of calling any API (zero cost; for runs that died after the calls)"
        type: string
        default: ""

permissions:
  contents: write
  id-token: write   # cosign keyless -> Fulcio cert -> Rekor entry
  issues: write     # self-monitoring: file an issue if a run fails

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the private batteries
        env:
          BATTERY_B64: ${{ secrets.SEISMO_BATTERY_B64 }}
          DEEP_BATTERY_B64: ${{ secrets.SEISMO_DEEP_BATTERY_B64 }}
          DECISION_BATTERY_B64: ${{ secrets.SEISMO_DECISION_BATTERY_B64 }}
        run: |
          test -n "$BATTERY_B64" || { echo "SEISMO_BATTERY_B64 missing"; exit 1; }
          mkdir -p battery
          printf '%s' "$BATTERY_B64" | base64 -d > battery/canary-v0.json
          # deep battery is only needed for weekly; absent is fine on daily
          if [ -n "$DEEP_BATTERY_B64" ]; then
            printf '%s' "$DEEP_BATTERY_B64" | base64 -d > battery/deep-v1.json
          fi
          # decision-model battery (typed Choice/Noul probes); absent is fine
          if [ -n "$DECISION_BATTERY_B64" ]; then
            printf '%s' "$DECISION_BATTERY_B64" | base64 -d > battery/decision-v0.json
          fi

      - name: Decide cadence
        id: cadence
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CAD="${{ inputs.cadence }}"
          elif [ "${{ github.event.schedule }}" = "45 8 * * 0" ]; then
            CAD="weekly"
          else
            CAD="daily"
          fi
          echo "cadence=$CAD" >> "$GITHUB_OUTPUT"
          # daily runs the fast 30-probe canary against daily models; weekly
          # runs the deep 94-probe battery against ALL models (per-dimension
          # statistical power + verifiable-answer capability probes).
          if [ "$CAD" = "weekly" ] && [ -f battery/deep-v1.json ]; then
            echo "battery=battery/deep-v1.json" >> "$GITHUB_OUTPUT"
          else
            echo "battery=battery/canary-v0.json" >> "$GITHUB_OUTPUT"
          fi
          # Mode. full = the scheduled run (every model, every tier).
          # targeted = rerun only the named models (or everything today's
          # reading shows as failed) and merge them into the day's reading, so
          # fixing one model never bills the fleet. redigest = no API calls:
          # digest the raw-session artifact of an earlier run that died after
          # its calls were made (Oct 10 2026: two full reruns for a digest bug).
          MODE=full; MODEL_ARGS=""; MERGE=""
          if [ -n "${{ inputs.from_run_id }}" ]; then
            MODE=redigest; MERGE="--merge"
          elif [ -n "${{ inputs.only_models }}" ]; then
            MODE=targeted; MERGE="--merge"
            LIST="${{ inputs.only_models }}"
            if [ "$LIST" = "failed" ]; then
              R=$(ls -1 readings/*/reading-$(date -u +%F)-"$CAD".json 2>/dev/null | tail -1)
              [ -n "$R" ] || { echo "only_models=failed but there is no reading for today yet"; exit 1; }
              LIST=$(python3 tools/check_coverage.py --failed "$R")
              [ -n "$LIST" ] || { echo "nothing failed in today's reading - nothing to rerun"; exit 1; }
            fi
            for id in $(echo "$LIST" | tr ',' ' '); do MODEL_ARGS="$MODEL_ARGS --model $id"; done
            echo "targeted rerun:$MODEL_ARGS"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "model_args=$MODEL_ARGS" >> "$GITHUB_OUTPUT"
          echo "merge=$MERGE" >> "$GITHUB_OUTPUT"

      - name: Fetch the raw-session artifact to re-digest
        if: steps.cadence.outputs.mode == 'redigest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p raw
          gh run download "${{ inputs.from_run_id }}" -n "raw-session-${{ inputs.from_run_id }}" -D raw
          ls -1 raw

      - name: Run the battery
        if: steps.cadence.outputs.mode != 'redigest'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          SEISMO_CODE_COMMIT: ${{ github.sha }}
        run: |
          # 10 workers: the run is I/O-bound on provider latency, and probe-
          # major interleave keeps per-provider concurrency ~1 across 12
          # providers, so this cuts wall-clock without hammering anyone. Run
          # time had crept to ~90 min at 4 workers as thinking-heavy models
          # joined - a budget risk against the 2,000 free private-repo minutes.
          python3 -m seismo.run --cadence "${{ steps.cadence.outputs.cadence }}" \
            --battery "${{ steps.cadence.outputs.battery }}" --out raw --workers 10 \
            ${{ steps.cadence.outputs.model_args }}

      - name: Digest to a reading
        run: |
          # Every fixed-tier session of this cadence in raw/ (one in a normal
          # run; a re-digest may hold the fixed AND dynamic sessions of the
          # failed run, told apart by the meta's dynamic_seed) gets digested;
          # --merge folds a partial session into the day's existing reading.
          CAD="${{ steps.cadence.outputs.cadence }}"; MERGE="${{ steps.cadence.outputs.merge }}"
          for S in raw/session-*-"$CAD".jsonl; do
            [ -f "$S" ] || continue
            if python3 -c "import json,sys; sys.exit(0 if json.load(open('${S%.jsonl}.meta.json')).get('dynamic_seed') is None else 1)"; then
              python3 -m seismo.digest "$S" --battery "${{ steps.cadence.outputs.battery }}" --out readings $MERGE
            else
              python3 -m seismo.digest --dynamic "$S" --out readings $MERGE
            fi
          done
          if [ "${{ steps.cadence.outputs.mode }}" = "redigest" ] && [ -f battery/decision-v0.json ]; then
            for S in raw/session-*-decision.jsonl; do
              [ -f "$S" ] && python3 -m seismo.digest "$S" --battery battery/decision-v0.json --out readings $MERGE
            done
          fi

      - name: Check coverage (every expected model answered today)
        # red + ntfy push the same hour if a rostered model is missing from
        # the reading or fully errored; the reading itself is still committed
        # below, so a short day is recorded, not hidden
        continue-on-error: true
        env:
          SEISMO_NTFY_TOPIC: ${{ secrets.SEISMO_NTFY_TOPIC }}
        run: |
          R=$(ls -1 readings/*/reading-$(date -u +%F)-"${{ steps.cadence.outputs.cadence }}".json | tail -1)
          python3 tools/check_coverage.py "$R"

      - name: Run the dynamic tier (Tier 2 gaming tripwire)
        if: steps.cadence.outputs.mode != 'redigest'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          SEISMO_CODE_COMMIT: ${{ github.sha }}
        run: |
          # Tier 2 needs NO battery secret - the probes are generated fresh from
          # a per-run seed by seismo/dynamic.py (never LLM-generated). The seed
          # lands in the session meta and is witnessed with everything else, so
          # the reading is reproducible. Runs against the SAME cadence's models
          # as the fixed tier so divergence pairs accrue day for day.
          CAD="${{ steps.cadence.outputs.cadence }}"
          python3 -m seismo.run --dynamic --cadence "$CAD" --out raw --workers 10 \
            ${{ steps.cadence.outputs.model_args }}
          DSESSION=$(ls -1t raw/session-*-"$CAD".jsonl | head -1)
          python3 -m seismo.digest --dynamic "$DSESSION" --out readings ${{ steps.cadence.outputs.merge }}

      - name: Run the decision-model battery
        if: steps.cadence.outputs.cadence == 'daily' && steps.cadence.outputs.mode == 'full'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          SEISMO_CODE_COMMIT: ${{ github.sha }}
        run: |
          # Decision models (typed-answer APIs such as Jev) have their own
          # battery and cadence: they never join the text batteries. Runs with
          # the daily job so the series accrues daily; skipped cleanly until
          # the battery secret exists.
          if [ ! -f battery/decision-v0.json ]; then
            echo "no decision battery restored; skipping"; exit 0
          fi
          python3 -m seismo.run --cadence decision --battery battery/decision-v0.json --out raw --workers 4
          DSESSION=$(ls -1t raw/session-*-decision.jsonl 2>/dev/null | head -1)
          [ -n "$DSESSION" ] && python3 -m seismo.digest "$DSESSION" --battery battery/decision-v0.json --out readings
          R=$(ls -1 readings/*/reading-$(date -u +%F)-decision.json 2>/dev/null | tail -1)
          [ -n "$R" ] && SEISMO_NTFY_TOPIC="${{ secrets.SEISMO_NTFY_TOPIC }}" python3 tools/check_coverage.py "$R" || true

      - name: Scrub harmful response text before witnessing
        run: |
          # The refusal-boundary probes elicit harmful content; grading is done
          # (both digests ran above), so the model's actual responses to those
          # probes are removed from every raw session now, BEFORE the sessions are
          # witnessed and archived. Non-text stats (status, tokens, latency) stay.
          # The reading already captured the pass rate; the archive never keeps
          # the harmful text.
          python3 -m seismo.scrub raw/session-*.jsonl

      - name: Rebuild the series artifact
        run: python3 -m seismo.series

      - name: Update the advisory feed
        run: python3 -m seismo.detect --write-advisories

      - name: Update the divergence log (fixed vs dynamic)
        run: python3 -m seismo.divergence --write-log

      - name: Witness in Rekor (cosign keyless)
        run: |
          curl -sSfL -o cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x cosign
          # sign-blob signs only the file's HASH (content never leaves the
          # runner), so witnessing the private raw session is safe and is the
          # correct integrity anchor: the raw session is the immutable
          # measurement; the reading is a reproducible derivation of it, and
          # advisories are derived from readings. Anchor the raw + code, treat
          # the rest as snapshots.
          # Both tiers ran this job, so witness EVERY raw session + meta from
          # this run (fixed and dynamic) and every reading written today, plus
          # the derived logs. The dynamic session's witnessed meta carries its
          # seed - that is what makes the Tier 2 reading reproducible.
          mkdir -p witness
          STAMP=$(date -u +%Y-%m-%dT%H%M%SZ)
          TODAY=$(date -u +%F)
          FILES=$(ls -1 raw/session-*.jsonl raw/session-*.meta.json 2>/dev/null)
          FILES="$FILES $(ls -1 readings/*/reading-${TODAY}-*.json 2>/dev/null)"
          FILES="$FILES advisories.json divergence.json"
          for f in $FILES; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            COSIGN_YES=true ./cosign sign-blob "$f" \
              --bundle "witness/${STAMP}-${base}.bundle.json"
          done

      - name: Commit reading + witness
        run: |
          git config user.name "seismograph-canary"
          git config user.email "actions@users.noreply.github.com"
          git add readings witness series.json advisories.json divergence.json
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "reading: $(date -u +%F) ${{ steps.cadence.outputs.cadence }} (${{ steps.cadence.outputs.mode }}) [skip ci]"
          # Two scheduled runs can race even with the concurrency queue: the
          # queued run checks out moments before the finishing run pushes
          # (Aug 23, Aug 30 - issue #32). readings/ and witness/ never collide
          # across cadences, but series.json and advisories.json are single
          # files BOTH cadences rewrite, so a textual rebase can genuinely
          # conflict - and both are pure derivations of readings/. On any
          # rejected push: rebase; if the derived files conflict, take
          # upstream's copies to finish the rebase; then REGENERATE both from
          # the now-merged readings/ and amend, so the pushed commit is always
          # derived from the full set. (The witness bundles anchor the raw
          # session hash; readings and derived files are reproducible
          # derivations per the charter's provenance model.)
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout --theirs series.json advisories.json divergence.json 2>/dev/null || true
              git add series.json advisories.json divergence.json
              GIT_EDITOR=true git rebase --continue
            fi
            python3 -m seismo.series
            python3 -m seismo.detect --write-advisories
            python3 -m seismo.divergence --write-log
            git add series.json advisories.json divergence.json
            git diff --cached --quiet || git commit --amend --no-edit
          done
          git push

      - name: Archive raw session to seismograph-raw
        env:
          RAW_PUSH_TOKEN: ${{ secrets.RAW_PUSH_TOKEN }}
        run: |
          if [ -z "$RAW_PUSH_TOKEN" ]; then
            echo "RAW_PUSH_TOKEN not set - raw session stays as workflow artifact only"
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${RAW_PUSH_TOKEN}@github.com/piperoll/seismograph-raw.git" rawrepo
          DEST="rawrepo/$(date -u +%Y)"
          mkdir -p "$DEST"
          cp raw/session-* "$DEST/"
          cd rawrepo
          git config user.name "seismograph-canary"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "raw: $(date -u +%F) ${{ steps.cadence.outputs.cadence }}"
          git push

      - name: Raw session fallback artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-session-${{ github.run_id }}
          path: raw/
          retention-days: 90

      # Self-monitoring: a silent failure is the worst failure for an
      # instrument whose value is an unbroken baseline. A run that dies files
      # an issue so a missed reading is loud, not invisible. (A run that never
      # FIRES cannot self-report - that gap needs an external heartbeat watcher;
      # tracked separately.)
      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "canary run failed: $(date -u +%F) ${{ steps.cadence.outputs.cadence }}" \
            --label "run-failure" \
            --body "The ${{ steps.cadence.outputs.cadence }} canary run failed - a reading may be missing for $(date -u +%F). A day not measured is a baseline gone forever; investigate promptly.\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          || echo "issue creation failed (label may not exist yet); run still failed"

      # A GitHub issue is a record, not a nudge - nobody watches the repo at
      # 08:30 UTC. ntfy pushes to a phone the moment a run dies, so a
      # baseline-threatening failure is loud in minutes, not at next login.
      # Topic is a secret (ntfy topics are world-readable by name); unset =
      # skipped, so the step is safe before the secret exists. Separate from the
      # issue step so one failing does not suppress the other.
      - name: Push failure alert (ntfy)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.SEISMO_NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] || { echo "SEISMO_NTFY_TOPIC unset - skipping push"; exit 0; }
          curl -sS --max-time 20 \
            -H "Title: seismograph canary FAILED" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light" \
            -d "The ${{ steps.cadence.outputs.cadence }} canary failed for $(date -u +%F). A missed reading is a baseline gone forever. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/${NTFY_TOPIC}" \
          || echo "ntfy push failed (non-fatal)"
