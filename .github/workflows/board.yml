# Public conditions board: rebuild + deploy on every canary run, so the board is
# always the latest witnessed readings instead of a hand-published snapshot.
# Triggered by canary COMPLETION (not the push - reading commits carry [skip ci]),
# so it fires after each daily/weekly run. Pages deploy is GATED on the repo
# variable PAGES_ENABLED='true', set at the public flip (Pages needs a public repo);
# until then this still builds the board and uploads it as a workflow artifact,
# proving the generator runs green in CI.
name: board
on:
  workflow_run:
    workflows: [canary]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: board
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # only after a SUCCESSFUL canary; manual dispatch always runs
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # explicit ref: main - workflow_run defaults to the SHA at canary START,
      # which predates the reading the canary just committed; main HEAD has it
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the board
        run: python3 tools/gen_board.py site/index.html
      - name: Upload board as a workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: board
          path: site/
          retention-days: 14
      - name: Upload Pages artifact
        if: ${{ vars.PAGES_ENABLED == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Deploy to GitHub Pages
        id: deploy
        if: ${{ vars.PAGES_ENABLED == 'true' }}
        uses: actions/deploy-pages@v4
